name: Fork validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Fork regression (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            jobs: 4
          - platform: windows
            runner: windows-latest
            jobs: 2
          - platform: macos
            runner: macos-latest
            jobs: 4
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      POLICY_SHA256: bf0872da4a8307ed02efa1ef0a7c81777a15470d0fd6f77e0d7290bea489cde0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate mutable Hermes state
        run: |
          echo "HERMES_HOME=$RUNNER_TEMP/fork-home" >> "$GITHUB_ENV"
          echo "HERMES_RUNTIME_DIR=$RUNNER_TEMP/fork-runtime" >> "$GITHUB_ENV"
      - name: Set up locked dependencies without production configuration
        uses: ./.github/actions/setup-pm
        with:
          extras: '["acp", "feishu", "keychain", "messaging", "telegram"]'
          test-environment: 'true'
      - name: Canonical static checks
        if: runner.os == 'Linux'
        run: '"$HERMES_PYTHON" scripts/check'
      # The canonical runner preserves HERMES_TEST_IMAGE specifically so
      # per-file pytest processes do not rebuild the same 5GB image concurrently.
      - name: Prepare the exact candidate Docker test image once
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/fork-evidence"
          docker build --iidfile "$RUNNER_TEMP/fork-test-image.id" \
            --label "org.opencontainers.image.revision=$EXPECTED_SHA" \
            -t "hermes-fork-validation:$EXPECTED_SHA" .
          image_id="$(cat "$RUNNER_TEMP/fork-test-image.id")"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")" = "$EXPECTED_SHA"
          export HERMES_TEST_IMAGE="$image_id"
          echo "HERMES_TEST_IMAGE=$image_id" >> "$GITHUB_ENV"
          "$HERMES_PYTHON" - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          image = os.environ["HERMES_TEST_IMAGE"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", image)
          proof = {"commit": os.environ["EXPECTED_SHA"],
                   "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                   "image_id": image, "revision_label_verified": True,
                   "build_count": 1, "preparation_timeout_seconds": 600}
          (Path(os.environ["RUNNER_TEMP"]) / "fork-evidence" / "docker-image.json").write_text(json.dumps(proof) + "\n", encoding="utf-8")
          PY
      - name: Verify exact candidate and run externally pinned regression list
        run: |
          "$HERMES_PYTHON" scripts/ci/fork_validation.py --bash "$BASH" \
            --platform '${{ matrix.platform }}' --expected-commit "$EXPECTED_SHA" \
            --policy-sha256 "$POLICY_SHA256" --output "$RUNNER_TEMP/fork-evidence" --jobs '${{ matrix.jobs }}'
      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-validation-${{ matrix.platform }}-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/fork-evidence
          if-no-files-found: error
      - uses: ./.github/actions/check-clean-worktree

  javascript:
    uses: ./.github/workflows/js-tests.yml
    with:
      commit: ${{ github.event.pull_request.head.sha || github.sha }}

  windows-install-update:
    uses: ./.github/workflows/windows-install-update-e2e.yml
    with:
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      strict_acceptance: '1'

  native-javascript:
    name: Fork native JavaScript (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      POLICY_SHA256: bf0872da4a8307ed02efa1ef0a7c81777a15470d0fd6f77e0d7290bea489cde0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Isolate mutable Hermes state
        run: |
          echo "HERMES_HOME=$RUNNER_TEMP/native-js-home" >> "$GITHUB_ENV"
          echo "HERMES_RUNTIME_DIR=$RUNNER_TEMP/native-js-runtime" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
      - name: Verify pinned candidate and select required native assertions
        run: |
          "$HERMES_PYTHON" scripts/ci/fork_native_javascript.py --initialize \
            --platform '${{ matrix.platform }}' --expected-commit "$EXPECTED_SHA" \
            --policy-sha256 "$POLICY_SHA256" --output "$RUNNER_TEMP/native-js-evidence"
      - name: Install locked desktop dependencies and prepare Electron
        run: |
          npm ci
          node scripts/build/electron-runtime.mjs --source .
      - name: Execute applicable native desktop and package admission tests
        run: |
          export HERMES_TEST_PYTHON="$HERMES_PYTHON"
          desktop=(); while IFS= read -r file; do desktop+=("$file"); done < "$RUNNER_TEMP/native-js-evidence/desktop-files.txt"
          # Cold certificate checks and SDK provisioning must not compete for
          # this host's two cores while their original per-test deadlines run.
          npm run --prefix apps/desktop test:desktop:platforms -- --maxWorkers=1 --retry=0 \
            --reporter=json --outputFile="$RUNNER_TEMP/native-js-evidence/desktop.json" "${desktop[@]}"
          root=(); while IFS= read -r file; do root+=("$file"); done < "$RUNNER_TEMP/native-js-evidence/root-files.txt"
          npm run --prefix tests-js test -- --retry=0 --reporter=json \
            --outputFile="$RUNNER_TEMP/native-js-evidence/root.json" "${root[@]}"
      - name: Reject missing, skipped or failed native assertions
        run: |
          "$HERMES_PYTHON" scripts/ci/fork_native_javascript.py \
            --platform '${{ matrix.platform }}' --expected-commit "$EXPECTED_SHA" \
            --policy-sha256 "$POLICY_SHA256" --output "$RUNNER_TEMP/native-js-evidence"
      - name: Upload exact-SHA native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-native-javascript-${{ matrix.platform }}-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/native-js-evidence
          if-no-files-found: error
      - uses: ./.github/actions/check-clean-worktree

  required:
    name: Fork required validation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [regression, javascript, windows-install-update, native-javascript]
    steps:
      - name: Require every lane to complete successfully
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          bad = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if bad:
              raise SystemExit(f'Required lanes did not all pass: {bad}')
          print('All required lanes completed successfully on the pinned candidate.')
          PY
